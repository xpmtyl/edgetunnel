name: Deploy edgetunnel to Cloudflare Workers

# 为什么不用 wrangler：
#   本仓库的 _worker.js 是 ES module（export default）。用 wrangler 上传会得到
#   Error 1101 "Worker threw exception" —— 脚本被当成「经典脚本」解析，export
#   直接语法错误。ES module 必须以 Content-Type: application/javascript+module
#   上传，因此这里直连 Cloudflare REST API（见 scripts/deploy.py），不依赖 npm。
#
# 触发：
#   - schedule 每天 01:00 UTC 兜底（sync.yml 00:00 拉上游后 1 小时）
#   - workflow_dispatch 手动
#   - push 到 _worker.js / scripts/deploy.py / 本工作流

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "_worker.js"
      - "scripts/deploy.py"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: 部署到 Cloudflare Workers
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 部署到 Cloudflare Workers
        run: python scripts/deploy.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: edgetunnel
          COMPAT_DATE: "2025-11-04"
          ADMIN: ${{ secrets.EDGETUNNEL_ADMIN }}
          PROXYIP: "ip.111000.de5.net"
